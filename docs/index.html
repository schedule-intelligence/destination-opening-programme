<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOP Schedule Intelligence</title>
<meta name="description" content="Decision-ready view of the fictional Destination Opening Programme: P6-format schedules, schedule quality, readiness, risks and recovery.">
<link rel="icon" href="data:,">
<script>
  /* Apply the stored theme before first paint (storage may be blocked: fail quietly). */
  (function () { try { var t = localStorage.getItem('dop-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-2:#F2F4F7;--border:#E2E8F0;--text:#1A202C;--muted:#4A5568;
  --brand:#1F3A5F;--brand-ink:#FFFFFF;--brand-muted:#C9D5E6;--accent:#2B7A78;--focus:#2B7A78;
  --s1:#1F3A5F;--s2:#2B7A78;--s3:#B7791F;--s4:#8E6C8A;--s5:#64748B;
  --red:#C0392B;--amber:#D68910;--green:#1E8449;
  --red-ink:#A93226;--amber-ink:#8A5A0B;--green-ink:#1A6E3C;--ok-on-brand:#A7E3C1;
  --grid:#E2E8F0;--shadow:0 1px 2px rgba(15,23,42,.05);
  --red-bg:color-mix(in srgb,var(--red) 13%,var(--surface));
  --amber-bg:color-mix(in srgb,var(--amber) 16%,var(--surface));
  --green-bg:color-mix(in srgb,var(--green) 12%,var(--surface));
  --accent-bg:color-mix(in srgb,var(--accent) 10%,var(--surface));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F172A;--surface:#1E293B;--surface-2:#172235;--border:#334155;--text:#E2E8F0;--muted:#94A3B8;
    --brand:#16213A;--brand-ink:#E2E8F0;--brand-muted:#94A3B8;--accent:#5FB8B3;--focus:#5FB8B3;
    --s1:#8DB0DC;--s2:#5FB8B3;--s3:#E0A84A;--s4:#C4A3C0;--s5:#94A3B8;
    --red:#E35D50;--amber:#E9A23B;--green:#3DB26C;
    --red-ink:#F59A90;--amber-ink:#F2C26B;--green-ink:#86D8A6;--ok-on-brand:#86D8A6;
    --grid:#334155;--shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F172A;--surface:#1E293B;--surface-2:#172235;--border:#334155;--text:#E2E8F0;--muted:#94A3B8;
  --brand:#16213A;--brand-ink:#E2E8F0;--brand-muted:#94A3B8;--accent:#5FB8B3;--focus:#5FB8B3;
  --s1:#8DB0DC;--s2:#5FB8B3;--s3:#E0A84A;--s4:#C4A3C0;--s5:#94A3B8;
  --red:#E35D50;--amber:#E9A23B;--green:#3DB26C;
  --red-ink:#F59A90;--amber-ink:#F2C26B;--green-ink:#86D8A6;--ok-on-brand:#86D8A6;
  --grid:#334155;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow-x:hidden}
a{color:var(--accent)}
h1,h2,h3,h4{line-height:1.3}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}
.skip{position:absolute;left:-9999px;top:0;background:var(--surface);color:var(--text);padding:8px 12px;z-index:100}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}

/* Header */
.hdr{background:var(--brand);color:var(--brand-ink)}
.hdr .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-top:12px;padding-bottom:12px}
.brand{min-width:0}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-muted);margin:0}
.brand h1{margin:0;font-size:19px;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0;flex:1 1 520px;min-width:0}
.facts>div{min-width:0}
.facts dt{font-size:11px;color:var(--brand-muted);margin:0}
.facts dd{margin:0;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.rec-ok{color:var(--ok-on-brand)}
.rec-bad{background:#C0392B;color:#fff;padding:1px 8px;border-radius:4px}
.btn{font:inherit;font-size:13px;border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:32px}
.btn-ghost{background:transparent;color:var(--brand-ink);border-color:color-mix(in srgb,var(--brand-ink) 40%,transparent)}
.btn-ghost:hover{background:color-mix(in srgb,var(--brand-ink) 10%,transparent)}

/* Controls */
.controls{background:var(--surface);border-bottom:1px solid var(--border)}
.controls .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-top:10px;padding-bottom:10px}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;max-width:100%}
select,input[type=search]{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;min-height:32px;max-width:100%;min-width:0}
.ctl select{max-width:min(320px,100%)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0;flex-wrap:wrap}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;margin:0;padding:0;align-items:center}
.crumbs li{display:flex;align-items:center}
.crumbs li+li::before{content:"\203A";margin:0 6px;color:var(--muted)}
.crumb{font:inherit;font-size:13px;background:none;border:0;padding:2px 4px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.crumb[aria-current="page"]{color:var(--text);text-decoration:none;font-weight:600;cursor:default}
.ctx{flex-basis:100%;margin:0;font-size:12px;color:var(--muted)}
.ctx:empty{display:none}

/* Tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--border)}
@media (min-width:900px){.tabs{position:sticky;top:0;z-index:20}}
.tabs .wrap{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:11px 6px 9px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-weight:500}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .n{color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
@media (max-width:1400px){.tab{font-size:12.5px;padding-left:5px;padding-right:5px}}
@media (max-width:1320px){.tab{font-size:12px;padding-left:4px;padding-right:4px}.tab .n{margin-right:3px}}

/* Layout */
main{padding:18px 0 32px}
[role=tabpanel]:focus-visible{outline-offset:6px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:1100px){.grid>*{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card>h3,.card-h h3{font-size:15px;margin:0 0 2px;font-weight:600}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:12px}
.card h4{font-size:13px;margin:14px 0 6px}
.sowhat{margin:12px 0 0;padding-top:9px;border-top:1px dashed var(--border);font-size:13px}
.sowhat::before{content:"So what: ";font-weight:600;color:var(--accent)}
.chartbox{position:relative;height:270px;min-width:0}
.chartbox.tall{height:330px}
.legend-note{font-size:12px;color:var(--muted);margin:6px 0 0}
.empty{color:var(--muted);font-style:italic}
.err{color:var(--red-ink);font-weight:600}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}

/* Hero */
.hero{border-left:4px solid var(--accent)}
.headline{font-size:21px;font-weight:600;margin:4px 0 10px;line-height:1.35}
.hero .eyebrow{color:var(--muted)}
.msgs{margin:0;padding-left:18px;color:var(--text)}
.msgs li{margin:3px 0}
.asks{border-left:4px solid var(--red)}
.ask{padding:9px 0;border-bottom:1px solid var(--border)}
.ask:last-child{border-bottom:0}
.ask .q{font-weight:600}
.ask .m{font-size:12px;color:var(--muted)}
.reco{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-bg);font-size:13px}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--border);border-radius:10px;padding:11px 14px;min-width:0}
.tile.is-ref{border-top-color:var(--accent);background:var(--accent-bg)}
.tile .lab{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tile .val{font-size:23px;font-weight:600;line-height:1.25;margin:3px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .note{font-size:12px;color:var(--muted)}
.hero .tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:16px 0 0;gap:10px}
.hero .tile{padding:9px 12px}
.hero .tile .val{font-size:20px}
.t td.wide{min-width:230px}
.reco-panel{border:1px solid var(--accent);border-radius:8px;padding:12px 14px;background:var(--accent-bg);font-size:13px}
.reco-panel h4{margin:0 0 6px;font-size:14px}
.reco-panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.reco-panel dt{color:var(--muted)}.reco-panel dd{margin:0;font-weight:600}
.tile{position:relative}
.tile .ref-tag{position:absolute;top:-9px;right:8px;font-size:10px;line-height:16px;padding:0 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;background:var(--accent);color:var(--surface);font-weight:700;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:13px}
.stats>div{display:flex;align-items:baseline;gap:6px;min-width:0}
.stats b{font-size:17px;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted)}
.tone-red{color:var(--red-ink)}.tone-amber{color:var(--amber-ink)}.tone-green{color:var(--green-ink)}

/* Info icon */
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:10px;font-weight:700;font-style:normal;cursor:help;flex:none;line-height:1;vertical-align:middle}

/* Tables */
.tw{overflow:auto;max-width:100%;border:1px solid var(--border);border-radius:8px;max-height:440px}
.tw.free{max-height:none}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1;vertical-align:bottom}
.t td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.t tbody tr:last-child td{border-bottom:0}
.t tr.hl td{background:var(--accent-bg)}
.t tr.key td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.t th button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-weight:600}
.t th[aria-sort] button::after{content:" \2195";opacity:.45}
.t th[aria-sort="ascending"] button::after{content:" \2191";opacity:1}
.t th[aria-sort="descending"] button::after{content:" \2193";opacity:1}
.t tr.clickable{cursor:pointer}
.t tr.clickable:hover td{background:var(--surface-2)}
.t tr.sel td{background:var(--accent-bg)}
.alink{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left;white-space:nowrap}
.aname{display:block;color:var(--muted);font-size:12px;white-space:normal;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;gap:4px;align-items:center;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--surface-2)}

/* Pills / status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;background:var(--surface);color:var(--text);line-height:1.6}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.red{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 45%,var(--border))}.pill.red i{background:var(--red);border-radius:1px}
.pill.amber{background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 50%,var(--border))}.pill.amber i{background:var(--amber);transform:rotate(45deg);border-radius:1px}
.pill.green{background:var(--green-bg);border-color:color-mix(in srgb,var(--green) 45%,var(--border))}.pill.green i{background:var(--green)}
.pill.accent{background:var(--accent-bg);border-color:var(--accent)}.pill.accent i{background:var(--accent)}
.var.late,.mv.up{color:var(--red-ink);font-weight:600}
.var.early,.mv.dn{color:var(--green-ink)}
.mv.eq{color:var(--muted)}
.tf.red{color:var(--red-ink);font-weight:600}.tf.amber{color:var(--amber-ink);font-weight:600}
.spark{vertical-align:middle}

/* RAG matrix */
.ragw{overflow-x:auto}
table.rag{border-collapse:separate;border-spacing:4px;width:100%;font-size:12px;min-width:520px}
.rag th{font-weight:600;color:var(--muted);text-align:center;padding:2px 4px;font-size:12px}
.rag th[scope=row]{text-align:left;white-space:nowrap}
.rag td{padding:0}
.rc{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;min-height:34px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;background:var(--surface-2);font-variant-numeric:tabular-nums;padding:2px 4px}
.rc .l{font-size:10px;font-weight:700;padding:0 4px;border-radius:3px;line-height:16px}
.rc.red{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 40%,var(--border))}.rc.red .l{background:#C0392B;color:#fff}
.rc.amber{background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 45%,var(--border))}.rc.amber .l{background:#D68910;color:#1A202C}
.rc.green{background:var(--green-bg);border-color:color-mix(in srgb,var(--green) 40%,var(--border))}.rc.green .l{background:#1E8449;color:#fff}
.rc.done .l{background:var(--s5);color:#fff}
.rc.na{cursor:default;color:var(--muted);background:transparent;border-style:dashed}
.rc.sel{outline:2px solid var(--accent);outline-offset:1px}
.rc.tot{border-width:2px}
.keyrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}

/* Gantt */
.gw{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
.gantt{min-width:860px;--gl:300px;--gt:76px;font-size:12px;position:relative}
.g-axis,.g-row{display:grid;grid-template-columns:var(--gl) minmax(0,1fr) var(--gt);align-items:center}
.g-axis{background:var(--surface-2);border-bottom:1px solid var(--border);height:28px;font-weight:600;color:var(--muted)}
.g-axis>div:first-child,.g-axis>div:last-child{padding:0 8px}
.g-ticks{position:relative;height:100%;overflow:hidden}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid);padding-left:3px;font-size:10px;font-weight:400;line-height:28px;white-space:nowrap}
.g-row{min-height:30px;border-bottom:1px solid var(--border)}
.g-row:last-child{border-bottom:0}
.g-row.dim{opacity:.35}
.g-lab{padding:3px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:sticky;left:0;z-index:3;background:var(--surface);align-self:stretch;display:flex;align-items:center}
.g-axis>div:first-child{position:sticky;left:0;z-index:3;background:var(--surface-2);align-self:stretch;display:flex;align-items:center}
.g-lab>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.g-lab>.alink{flex:none}
.g-lab .alink{margin-right:6px}
.loe-tag{flex:none;margin-left:6px;font:inherit;font-size:11px;font-weight:600;line-height:1.5;padding:0 7px;border-radius:999px;cursor:pointer;color:var(--amber-ink);background:var(--amber-bg);border:1px dashed var(--amber)}
.loe-tag:hover,.loe-tag:focus-visible{border-style:solid}
.g-track{position:relative;height:30px}
.g-bar{position:absolute;top:9px;height:12px;border-radius:3px;background:var(--s1);overflow:hidden;min-width:3px}
.g-bar.red{background:var(--red)}.g-bar.amber{background:var(--amber)}.g-bar.cmp{background:var(--s5)}
.g-bar.loe{background:transparent;border:1.5px dashed var(--s5)}
.g-done{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)}
.g-ms{position:absolute;top:9px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--s1)}
.g-ms.red{background:var(--red)}.g-ms.amber{background:var(--amber)}
.g-tf{padding:0 8px;text-align:right}
.g-ddl{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--accent);pointer-events:none;z-index:2}
@media (max-width:640px){.gantt{--gl:150px;--gt:58px;min-width:600px}}
.gkey{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 0}
.gkey span{display:inline-flex;align-items:center;gap:6px}
.gkey b{display:inline-block;width:18px;height:10px;border-radius:2px}

/* Readiness chain */
.chain-asset{margin:0 0 14px}
.chain-asset h4{margin:0 0 6px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.chain-asset h4 span{font-weight:400;color:var(--muted);font-size:12px}
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.chain{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.chain{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stg{border:1px solid var(--border);border-left:4px solid var(--s5);border-radius:6px;padding:7px 9px;background:var(--surface);font-size:12px;min-width:0}
.stg.red{border-left-color:var(--red);background:var(--red-bg)}.stg.amber{border-left-color:var(--amber)}.stg.green{border-left-color:var(--green)}
.stg .nm{font-weight:600;display:block}
.stg .dt{font-size:14px;font-weight:600;display:block;font-variant-numeric:tabular-nums}
.stg .mt{color:var(--muted);display:block}
.stg .sp{color:var(--muted);font-size:11px;display:block}

/* Lineage */
.lin{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:22px}
.lin li{position:relative;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface-2);font-size:12px;min-width:0}
.lin li b{display:block;font-size:13px;margin-bottom:3px}
.lin li .d{color:var(--muted);overflow-wrap:anywhere}
.lin li.gate{border:2px solid var(--accent);background:var(--accent-bg)}
.lin li.gate.fail{border-color:var(--red);background:var(--red-bg)}
.lin li:not(:last-child)::after{content:"\2192";position:absolute;right:-16px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700;font-size:16px}
@media (max-width:1100px){.lin{grid-template-columns:1fr;gap:20px}.lin li:not(:last-child)::after{content:"\2193";right:auto;left:50%;top:auto;bottom:-20px;transform:translateX(-50%)}}
ol.steps{margin:0;padding-left:20px}ol.steps li{margin:4px 0}
.prose p,.prose li{max-width:80ch}
.prose ul{padding-left:20px}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}

/* Explorer */
.explorer{margin-top:4px}
.explorer>summary{cursor:pointer;font-weight:600;font-size:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;list-style-position:inside}
.explorer[open]>summary{border-radius:10px 10px 0 0;border-bottom:0}
.explorer .xbody{background:var(--surface);border:1px solid var(--border);border-top:0;border-radius:0 0 10px 10px;padding:12px 16px 16px}
.explorer .xs{font-weight:400;color:var(--muted);font-size:12px}

/* Drawer */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:100%;background:var(--surface);border-left:1px solid var(--border);z-index:50;overflow-y:auto;padding:16px 18px 40px;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
.drawer h2{font-size:17px;margin:0;line-height:1.35}
.drawer h3{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dhead .btn{white-space:nowrap;flex:none}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.kv>div{min-width:0;border-bottom:1px solid var(--border);padding-bottom:4px}
.kv dt{font-size:11px;color:var(--muted)}.kv dd{margin:0;font-weight:600;font-size:13px;overflow-wrap:anywhere}
[hidden]{display:none!important}
footer{border-top:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px}
footer .wrap{padding-top:14px;padding-bottom:18px}
.loading{padding:40px 0;color:var(--muted)}

@media print{
  :root,:root[data-theme="dark"]{color-scheme:light;--bg:#fff;--surface:#fff;--surface-2:#F2F4F7;--border:#E2E8F0;--text:#1A202C;--muted:#4A5568;--brand:#fff;--brand-ink:#1A202C;--brand-muted:#4A5568;--accent:#2B7A78;--s1:#1F3A5F;--s2:#2B7A78;--s3:#B7791F;--s4:#8E6C8A;--s5:#64748B;--red:#C0392B;--amber:#D68910;--green:#1E8449;--red-ink:#A93226;--amber-ink:#8A5A0B;--green-ink:#1A6E3C;--ok-on-brand:#1A6E3C;--grid:#E2E8F0}
  .controls,.tabs,.drawer,.backdrop,.explorer,.skip,.noprint,#theme-btn{display:none!important}
  body{background:#fff}
  .card,.tile{box-shadow:none;break-inside:avoid}
  .tw{max-height:none!important;overflow:visible}
  [role=tabpanel][hidden]{display:none!important}
  .hdr{border-bottom:2px solid #1F3A5F}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="hdr">
  <div class="wrap">
    <div class="brand">
      <p class="eyebrow">Schedule intelligence · Programme controls</p>
      <h1 id="h-name">Destination Opening Programme</h1>
    </div>
    <dl class="facts" aria-live="polite">
      <div><dt>Data date</dt><dd id="h-dd">–</dd></div>
      <div><dt>Baseline in force</dt><dd id="h-bl">–</dd></div>
      <div><dt>Reconciliation</dt><dd id="h-rec">–</dd></div>
      <div><dt>DQ score</dt><dd id="h-dq">–</dd></div>
      <div><dt>Generated</dt><dd id="h-gen">–</dd></div>
    </dl>
    <button type="button" class="btn btn-ghost noprint" id="theme-btn" aria-pressed="false">Dark mode</button>
  </div>
</header>

<div class="controls" role="region" aria-label="Report controls">
  <div class="wrap">
    <label class="ctl" for="sel-dd">Data date <select id="sel-dd"></select></label>
    <label class="ctl" for="sel-cmp">Compare to
      <select id="sel-cmp">
        <option value="prev">Previous period</option>
        <option value="BL0">BL0 (original baseline)</option>
        <option value="BL1">BL1 (re-baseline, CR-003)</option>
      </select>
    </label>
    <nav class="crumbs" aria-label="Drill-down"><span>Scope</span><ol id="crumbs"></ol></nav>
    <label class="ctl" for="sel-drill">Drill into <select id="sel-drill"></select></label>
    <p class="ctx" id="ctx-note" aria-live="polite"></p>
  </div>
</div>

<nav class="tabs" aria-label="Dashboard sections">
  <div class="wrap" role="tablist" id="tablist" aria-label="Dashboard sections"></div>
</nav>

<main id="main">
  <div class="wrap">
    <div id="panels"><p class="loading">Loading programme data…</p></div>
    <details class="explorer" id="explorer">
      <summary>Activity explorer <span class="xs" id="x-sum"></span></summary>
      <div class="xbody">
        <div class="row-actions">
          <label class="ctl" for="x-q">Search <input type="search" id="x-q" placeholder="ID, name or owner" autocomplete="off"></label>
          <span class="muted" id="x-count" aria-live="polite"></span>
        </div>
        <div id="x-table"></div>
      </div>
    </details>
  </div>
</main>

<footer>
  <div class="wrap" id="foot">Fictional programme and data.</div>
</footer>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" hidden tabindex="-1"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  var R = {};

  /* ================================================================== 1 Executive summary */
  R.exec = function (p) {

    /* RAG matrix */
    var assets = Object.keys(D.meta.assets || {}), wss = Object.keys(D.meta.workstreams || {});
    var cell = function (as, ws) {
      var list = s.acts.filter(function (a) { return (!as || a.asset === as) && (!ws || a.ws === ws); });

    var reds = 0, cells = 0, worst = null, cellList = [];
    var btn = function (as, ws, tot) {

    var ragTitle = reds ? 'Negative float sits in ' + reds + ' of ' + cells + ' asset × workstream cells; the deepest is ' + sd(worst.m, 'wd') + '.' : 'No asset × workstream cell carries negative float.';

      var x = xVal(a, k), y = xVal(b, k);

  }

  /* ------------------------------------------------------------------ drawer */
  function openDrawer(id, opener) {

      html += '<p style="margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap">' + statusPill(a.status) + (a.is_longest_path ? pill('red', 'Longest path') : '') + (a.is_critical ? pill('red', 'Critical') : '') + (a.is_near_critical ? pill('amber', 'Near-critical') : '') + '</p>';
      html += '<h3>Dates and float at ' + fd(ST.dd) + '</h3>' + kv([
        ['Start' + (a.actual_start ? ' (actual)' : ''), fd(a.start)], ['Finish' + (a.actual_finish ? ' (actual)' : ''), fd(a.finish)],
        ['BL0 start / finish', fd(a.bl0_start) + ' / ' + fd(a.bl0_finish)], ['BL1 start / finish', fd(a.bl1_start) + ' / ' + fd(a.bl1_finish)],

        ['Late start / finish', fd(a.late_start) + ' / ' + fd(a.late_finish)], ['Total float', tfCell(a.total_float_d), 'Total float'],
        ['Free float', isNum(a.free_float_d) ? sd(a.free_float_d, 'wd') : '–', 'Free float'], ['Duration orig. / rem.', nf(a.orig_dur_d) + ' / ' + nf(a.rem_dur_d) + ' wd'],
        ['% complete (duration / physical)', nf(a.pct_duration) + '% / ' + nf(a.pct_physical) + '%', 'Duration % complete'], ['Constraint', a.constraint_type ? esc(a.constraint_type) + ' ' + fd(a.constraint_date) : 'None']
      ]);
      html += '<h3>Codes</h3>' + kv([
        ['Asset', esc(assetName(m.asset_code))], ['Workstream', esc(wsName(m.workstream_code))], ['WBS package', esc(pkgName(m.package_code))], ['Owner', esc(ownerName(m.owner_code)) + ' (' + esc(m.owner_code) + ')'],
        ['Phase', esc(m.phase)], ['Activity type', esc(m.activity_type)], ['Calendar', esc(cal ? cal.calendar_name : m.calendar_id)], ['Interface role', esc(m.interface_role)],
        ['Readiness gate', esc(m.readiness_gate || '–')], ['In BL0 / BL1', (m.in_bl0 ? 'Yes' : 'No') + ' / ' + (m.in_bl1 ? 'Yes' : 'No')]
      ]);

      var relT = function (list, k) {
        if (!list || !list.length) return '<p class="empty">None.</p>';
        return table([{ t: k === 'pred' ? 'Predecessor' : 'Successor' }, { t: 'Type' }, { t: 'Lag', cls: 'num' }, { t: 'Driving' }, { t: 'TF', cls: 'num' }], list.map(function (r) { var o = s.by.get(r[k]); return [actCell(r[k]), esc(r.type), sd(r.lag_d, 'wd').replace('±0 wd', '0'), r.driving ? pill('accent', 'Driving') : '–', tfCell(o ? o.total_float_d : null)]; }), { label: k === 'pred' ? 'Predecessors' : 'Successors', max: 260 });
      };

  /* ------------------------------------------------------------------ theme */
  function storedTheme() { try { var v = localStorage.getItem('dop-theme'); return v === 'light' || v === 'dark' ? v : null; } catch (e) { return null; } }

  /* ------------------------------------------------------------------ events */
  function setDrill(d) { ST.drill = { asset: d.asset || null, ws: d.ws || null, pkg: d.pkg || null, act: d.act || null }; ST.ifCell = null; }
  function wire() {
    document.getElementById('sel-dd').addEventListener('change', function (e) { ST.dd = e.target.value; renderAll(); });

    });

      if (k === 'programme') setDrill({}); else if (k === 'asset') setDrill({ asset: d.asset }); else if (k === 'ws') setDrill({ asset: d.asset, ws: d.ws }); else if (k === 'pkg') setDrill({ asset: d.asset, ws: d.ws, pkg: d.pkg }); else return;

      if (e.key === 'Tab' && ST.drawer) {
        var f = Array.prototype.slice.call(document.getElementById('drawer').querySelectorAll('button, [href], [tabindex="0"], select, input')).filter(function (x) { return x.offsetParent !== null; });

    var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (D) snapBoxes(document.getElementById('p-' + ST.tab)); }, 150); });
    window.addEventListener('beforeprint', function () { if (D) { var cur = document.documentElement.getAttribute('data-theme'); ST.printTheme = cur; document.documentElement.setAttribute('data-theme', 'light'); renderTab(); } });
    window.addEventListener('afterprint', function () { if (D) { if (ST.printTheme) document.documentElement.setAttribute('data-theme', ST.printTheme); else document.documentElement.removeAttribute('data-theme'); renderTab(); } });
  }

  });
})();
